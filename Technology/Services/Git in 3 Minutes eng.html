<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Git in 3 Minutes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lemonada:wght@400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: notebook page. Top bar, wobbling hand-drawn stage in the middle, taped caption card at the bottom. Single paper look by choice. */
:root{--paper:#f2ead8;--ink:#2a2420;--red:#d9443b;--mus:#e8a93a;--teal:#2f9e92;--blue:#3b6fb6;--wood:#d9ab6a;--cream:#fff8dc;--f:Lemonada,Cairo,system-ui,sans-serif;--m:ui-monospace,Menlo,Consolas,monospace;--rad:14px 9px 16px 10px/10px 15px 9px 14px}
html,body{height:100%}
body{margin:0;box-sizing:border-box;background:var(--paper);color:var(--ink);font-family:var(--f);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;mix-blend-mode:multiply;opacity:.55;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .3 0 0 0 .5 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;max-width:1100px;margin:0 auto}
.top{display:grid;gap:7px;padding-top:10px}
.row1{display:flex;align-items:center;gap:10px}
.num{flex:none;min-width:46px;text-align:center;font-weight:700;font-size:15px;background:var(--mus);border:3px solid var(--ink);border-radius:50% 45% 55% 50%/50% 55% 45% 50%;padding:7px 6px;box-shadow:3px 4px 0 var(--ink)}
.ttl{flex:1;min-width:0;display:grid;line-height:1.2}
.ttl b{font-size:clamp(15px,2.6vw,21px)}
.ttl small{font-size:12px;opacity:.75}
.b{font:inherit;font-size:14px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:var(--rad);box-shadow:3px 4px 0 var(--ink);padding:4px 11px;cursor:pointer}
.b:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.b:focus-visible,.d:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bar{height:14px;border:3px solid var(--ink);border-radius:10px 6px 12px 7px/7px 11px 6px 10px;background:var(--cream);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;width:0;background:repeating-linear-gradient(-45deg,var(--red) 0 5px,var(--mus) 5px 10px)}
.dots{display:flex;gap:8px;justify-content:center}
.d{width:24px;height:24px;padding:0;cursor:pointer;background:var(--cream);border:3px solid var(--ink);border-radius:55% 45% 50% 50%/50% 55% 45% 50%}
.d:nth-child(even){border-radius:45% 55% 50% 50%/55% 45% 55% 45%}
.d.done{background:var(--mus)}.d.on{background:var(--red);transform:scale(1.2)}
.stage{min-height:0;position:relative}
#st{width:100%;height:100%;display:block;overflow:visible}
#st text{stroke:none;fill:var(--ink);font-family:var(--f);font-size:22px;direction:ltr}
#st .m{font-family:var(--m)}#st .sm{font-size:18px}#st .w{fill:var(--cream)}#st .r{fill:var(--red)}
.sc{display:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.sc.on{display:block}
.sc .pop,.sc .fade,.sc .grow{opacity:0}
.sc .pop{transform-box:fill-box;transform-origin:center}
.sc.on .pop{animation:pop .5s var(--d,0s) both}
.sc.on .fade{animation:fd .7s var(--d,0s) forwards}
.sc .dr{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.sc.on .dr{animation:draw 1.4s var(--d,0s) both ease-out}
.sc .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.sc.on .grow{animation:gr 2.4s var(--d,0s) forwards ease-out}
.sc .gh{stroke-dasharray:8 7}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 7s linear infinite}.spin.fast{animation-duration:1.4s}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 1.6s ease-in-out infinite}
.mv{transform:translateX(490px)}.sc.on .mv{animation:mv 1s 8s ease-in-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-7deg)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes fd{to{opacity:1}}@keyframes draw{0%{opacity:0;stroke-dashoffset:1}1%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}@keyframes gr{to{opacity:1;transform:scaleX(1)}}
@keyframes rfp{0%{opacity:0;transform:scale(.3) rotate(-8deg)}70%{opacity:1;transform:scale(1.08) rotate(3deg)}100%{opacity:1;transform:rotate(2.5deg)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:scale(1.07) rotate(1.5deg)}}
@keyframes mv{from{transform:translateX(490px)}to{transform:translateX(620px)}}
.cap{position:relative;margin:12px 0 10px;background:var(--cream);border:3px solid var(--ink);border-radius:var(--rad);box-shadow:4px 5px 0 var(--ink);padding:16px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,250px);gap:4px 18px}
.cap::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(-2deg);background:repeating-linear-gradient(45deg,rgba(232,169,58,.8) 0 6px,rgba(232,169,58,.55) 6px 9px);border:2px solid rgba(42,36,32,.3)}
.ct{margin:0;font-size:clamp(15px,2.4vw,20px)}
.cc{margin:4px 0 2px;font-size:clamp(12.5px,1.7vw,15px);line-height:1.65;max-width:65ch}
.rf{grid-column:2;grid-row:1/3;align-self:start;background:#ffe066;border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);padding:9px 11px;font-size:clamp(11.5px,1.5vw,13px);line-height:1.55;transform:rotate(2.5deg)}
.rf b{display:block;color:var(--red);text-transform:uppercase;letter-spacing:.1em;font-size:.82em;margin-bottom:2px}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{background:var(--c);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px 8px 13px 9px/9px 12px 8px 12px;padding:2px 10px;font-size:12px;box-shadow:2px 3px 0 var(--ink);opacity:0;animation:pop .45s var(--d) both}
.sheet{position:fixed;top:-10%;bottom:-10%;left:-30%;width:160%;z-index:40;pointer-events:none;visibility:hidden;transform:translateX(-110%) rotate(-3deg);background:repeating-linear-gradient(45deg,#f2ead8 0 8px,#d9ccaa 8px 10px);border-inline:6px solid var(--ink);box-shadow:8px 0 0 rgba(42,36,32,.4)}
.paused *,.paused{animation-play-state:paused!important}
@media(max-width:640px){.cap{grid-template-columns:1fr;padding:14px 12px 10px}.rf{grid-column:1;grid-row:auto;transform:rotate(1.5deg)}.dots{gap:5px}.d{width:22px;height:22px}}
@media(prefers-reduced-motion:reduce){.spin,.bob{animation:none}}
</style>

 FL[idx].forEach((f,k)=>{if(d&&t>=f[3]&&t<=f[4]){acc[k]+=f[2]*d*m;while(acc[k]>=1){acc[k]--;
  const el=document.createElementNS(NS,'circle');el.setAttribute('r','5.5');el.setAttribute('fill',f[1]);$('pt').appendChild(el);
  P.push({el,path:$(f[0]),len:LEN[f[0]],u:0,dur:f[5]||2.4})}}});
 P=P.filter(p=>{p.u+=d*m/p.dur;if(p.u>=1){p.el.remove();return false}
  const q=p.path.getPointAtLength(p.u*p.len);p.el.setAttribute('cx',q.x);p.el.setAttribute('cy',q.y);
  p.el.setAttribute('opacity',Math.min(1,p.u*8,(1-p.u)*8));return true});
 if(UPD[idx])UPD[idx](t);
 $('pg').style.width=((idx*DUR+t)/(N*DUR)*100)+'%';
 requestAnimationFrame(frame)}
const lo=$('loose');for(let i=0;i<18;i++){const r=document.createElementNS(NS,'rect');
 [['x',40+(i%6)*40],['y',95+Math.floor(i/6)*40],['width',30],['height',30],['rx',5],['fill',['#d9ab6a','#fff8dc','#2f9e92'][i%3]],['class','pop'],['style','--d:'+(.2+i*.13).toFixed(2)+'s']].forEach(a=>r.setAttribute(a[0],a[1]));lo.appendChild(r)}
SC.forEach((s,i)=>{const b=document.createElement('button');b.className='d';b.setAttribute('aria-label','Scene '+(i+1)+': '+s.t);b.onclick=()=>go(i);$('dots').appendChild(b)});
$('pp').onclick=()=>setPause(!paused);$('rs').onclick=()=>go(0);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);else if(e.key===' '){e.preventDefault();setPause(!paused)}});
setInterval(()=>$('tb').setAttribute('seed',seed=seed%24+1),150);
show(0);last=performance.now();requestAnimationFrame(frame);
