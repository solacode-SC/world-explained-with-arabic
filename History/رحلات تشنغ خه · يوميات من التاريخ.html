<style>

.compass{position:absolute;right:170px;top:-88px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#f3e2a6 0 54%,#b88a2c 56%);box-shadow:0 6px 12px rgba(0,0,0,.6)}
.compass::before{content:"";position:absolute;left:50%;top:9px;width:4px;height:56px;margin-left:-2px;background:linear-gradient(#c8372d 50%,#222 50%);animation:sw 4.5s ease-in-out infinite alternate}

.page,.face{position:absolute;inset:0;border-radius:4px 8px 8px 4px;background-color:var(--paper);

box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 90px rgba(150,100,40,.3)}
.leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;animation:flip 6s ease-in-out 86s both}

.face{backface-visibility:hidden}.back{transform:rotateY(180deg);background-image:linear-gradient(270deg,rgba(0,0,0,.14),transparent 6%),repeating-linear-gradient(transparent 0 33px,rgba(110,140,170,.35) 33px 34px)}
.en{position:absolute;right:40px;width:392px}
.dt{font-weight:600;font-size:25px;line-height:34px;white-space:nowrap}

.ln{position:relative;width:max-content;font-size:19px;line-height:34px;white-space:nowrap}
.ln::after{content:"";position:absolute;top:12px;right:-3px;width:7px;height:7px;border-radius:50% 50% 50% 0;rotate:-45deg;background:#0b2431;opacity:0;animation:nib var(--d) linear var(--t) both}

.nt{display:inline-block;font-family:var(--ruq);font-size:24px;line-height:32px;color:var(--orange);border-bottom:3px double var(--orange);white-space:nowrap}
.dd{position:absolute;left:24px;width:300px;height:240px}
.dd svg{width:100%;height:100%;overflow:visible}
.dd path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--d,2s) ease-in-out var(--t,0s) both}
.dd path.o{stroke:var(--orange)}
.dd path.f,.dd path.s,.dd path.v{fill-opacity:0;animation:dr var(--d,2s) ease-in-out var(--t,0s) both,ff 1.6s ease-out calc(var(--t,0s) + var(--d,2s)) both}
.dd path.f{fill:rgba(196,146,70,.34)}.dd path.s{fill:rgba(40,130,150,.2);stroke:rgba(40,100,120,.45);stroke-width:2}.dd path.v{fill:rgba(200,55,45,.6)}
.dd path.r{stroke:var(--red);stroke-width:3.2;animation-timing-function:linear}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes ff{to{fill-opacity:1}}
.ship{position:absolute;left:0;top:0;width:28px;height:28px;offset-rotate:0deg;opacity:0;animation:sail var(--d) linear var(--t) both;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

.tx{position:absolute;transform:translateX(-50%);white-space:nowrap;font-family:var(--ruq);color:var(--ink)}.tx.o{color:var(--teal);font-weight:700}

.tag{position:absolute;left:84px;font-size:16px;line-height:24px;padding:3px 12px;border:1.5px dashed var(--orange);border-radius:12px;background:rgba(255,255,255,.55);color:var(--ink);white-space:nowrap}
.tape{position:absolute;width:150px;height:38px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 8px,rgba(200,55,45,.4) 8px 16px);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.stamp{position:absolute;width:76px;height:76px;border:3.5px solid var(--red);border-radius:8px;display:grid;place-items:center;text-align:center;font-family:var(--ruq);font-size:17px;line-height:20px;color:var(--red);mix-blend-mode:multiply}
.hd{position:absolute;top:26px;right:40px;left:40px;height:64px;display:flex;gap:52px;align-items:flex-start}
.vd{width:38px;text-align:center;font-size:14px;line-height:16px}
.vc{width:36px;height:36px;margin-bottom:2px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--ruq);font-size:21px;background:rgba(200,55,45,.18)}
.hl{position:absolute;top:30px;left:40px;font-family:var(--ruq);font-size:22px;color:var(--orange)}
.hln{position:absolute;top:44px;right:60px;left:200px;border-top:2px dashed rgba(34,25,15,.35)}
.rv{clip-path:inset(0 0 0 100%);animation:rv var(--d,3s) linear var(--t,0s) both}
@keyframes rv{to{clip-path:inset(0 0 0 0)}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.3,1.6,.5,1) var(--t,0s) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.fd{opacity:0;animation:fd 2s ease-out var(--t,0s) both}
@keyframes fd{to{opacity:1}}
.paused *,.paused::before{animation-play-state:paused !important}
.rst *{animation:none !important}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 18%,rgba(255,110,70,.3),transparent 52%);mix-blend-mode:screen;animation:fl 3.1s ease-in-out infinite alternate}

.rays{position:absolute;inset:-20%;pointer-events:none;background:repeating-linear-gradient(68deg,transparent 0 90px,rgba(255,200,150,.06) 90px 150px);mask-image:radial-gradient(circle at 80% 15%,#000,transparent 70%);animation:dr2 26s ease-in-out infinite alternate}
@keyframes dr2{to{translate:-80px 30px}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(2,6,10,.84) 100%)}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,225,170,.65);animation:fy var(--s) linear infinite}
@keyframes fy{from{transform:translate(0,40px);opacity:0}20%{opacity:.9}to{transform:translate(-70px,-120vh);opacity:0}}
.card{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:14px;background:radial-gradient(circle,rgba(8,30,42,.9),#03080c);color:var(--gold);overflow:hidden}
.card h1{position:relative;font-family:var(--ruq);font-size:clamp(50px,11vw,120px);font-weight:700;line-height:1.1;text-shadow:0 0 30px rgba(230,150,70,.5)}
.card p{position:relative;font-size:clamp(16px,2.6vw,28px);padding:0 16px}
.wv{position:absolute;left:0;bottom:0;width:200%;height:30%;animation:wv 14s linear infinite}
.wv path{fill:rgba(28,110,125,.45)}.wv.b{height:22%;animation-duration:9s;animation-direction:reverse}.wv.b path{fill:rgba(60,160,170,.35)}
@keyframes wv{to{translate:-50% 0}}
#intro{opacity:0;pointer-events:none;animation:intro 12s ease-in-out both}
@keyframes intro{0%{opacity:0}8%,68%{opacity:1}100%{opacity:0}}
#outro{opacity:0;pointer-events:none;animation:fd 3s ease-out 170s both}
#bar{position:absolute;left:0;bottom:0;height:4px;width:100%;transform-origin:right;background:var(--gold);transform:scaleX(0);animation:pr 180s linear both}
@keyframes pr{to{transform:scaleX(1)}}
#ctl{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));translate:-50% 0;display:flex;gap:10px;z-index:5}
#ctl button{font:inherit;font-size:20px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(230,194,122,.6);background:rgba(4,12,18,.75);color:var(--gold);cursor:pointer}
#ctl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dust,.rays{display:none}}
</style>
</head>

function cam(){
 const vw=innerWidth,vh=innerHeight,s0=Math.min(vw*.9/760,vh*.88/1060),fs=Math.min(vw*.95/740,vh*.82/330);
 const at=(cx,cy,s)=>`translate(${vw/2-cx*s}px,${vh/2-cy*s}px) scale(${s})`;
 const ov=at(380,530,s0),f=e=>at(380,e.top+130,fs),p=x=>(x/1.8).toFixed(2)+'%';
 const F=[[16,36,A[0]],[40,60,A[1]],[64,84,A[2]],[98,120,B[0]],[124,146,B[1]],[150,170,B[2]]];
 let k=`0%,${p(9)}{transform:${ov}}`;F.forEach(([a,b,e])=>k+=`${p(a)},${p(b)}{transform:${f(e)}}`);
 k+=`${p(87)},${p(93)}{transform:${at(380,530,s0*1.05)}}${p(177)},100%{transform:${ov}}`;
 kf.textContent=`@keyframes cam{${k}}`;
}
cam();addEventListener('resize',cam);
const d=document.getElementById('desk'),pp=document.getElementById('pp');
pp.onclick=()=>{const q=d.classList.toggle('paused');pp.textContent=q?'▶':'❚❚';pp.setAttribute('aria-label',q?'متابعة':'إيقاف مؤقت')};
document.getElementById('rp').onclick=()=>{d.classList.remove('paused');pp.textContent='❚❚';d.classList.add('rst');void d.offsetWidth;d.classList.remove('rst')};
</script>
