<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيت الحكمة · يوميات من التاريخ</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;600&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2118;--orange:#d97a1f;--paper:#f6ecd4;--gold:#e6c27a;--hand:'Playpen Sans Arabic','Mada','Segoe UI',Tahoma,sans-serif;--ruq:'Aref Ruqaa','Amiri','Traditional Arabic',serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0d0a14}
body{font-family:var(--hand);color:var(--ink)}
#desk{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 28% 22%,#2f3a63 0,#171a33 48%,#07060d 100%)}
#desk::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(95deg,rgba(0,0,0,.18) 0 2px,transparent 2px 10px,rgba(160,180,255,.035) 10px 12px)}
#cam{position:absolute;left:0;top:0;width:760px;height:1060px;transform-origin:0 0;animation:cam 180s ease-in-out both}
.book{position:absolute;inset:0;perspective:2400px;opacity:0;animation:bk 3.5s ease-out 9s both}
@keyframes bk{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
.cover{position:absolute;left:-40px;top:-28px;width:836px;height:1116px;background:#1f5a63;border-radius:16px;box-shadow:0 34px 70px rgba(0,0,0,.7);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px)}
.cover::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(230,194,122,.55);border-radius:10px}
.prev{position:absolute;left:-30px;top:-14px;width:70px;height:1090px;background:repeating-linear-gradient(transparent 0 33px,rgba(110,140,170,.35) 33px 34px),#efe3c6;border-radius:8px 0 0 8px;box-shadow:inset -10px 0 12px rgba(0,0,0,.2)}
.roll{position:absolute;right:30px;top:-100px;width:96px;height:96px;border-radius:50%;border:14px solid #d8d2bf;background:#171a33;box-shadow:0 6px 14px rgba(0,0,0,.6)}
.inkpot{position:absolute;right:170px;top:-80px;width:56px;height:56px;border-radius:12px 12px 18px 18px;background:radial-gradient(circle at 35% 30%,#4a5aa0,#10142c);box-shadow:0 6px 12px rgba(0,0,0,.6)}
.page,.face{position:absolute;inset:0;border-radius:4px 8px 8px 4px;background-color:var(--paper);
background-image:linear-gradient(90deg,rgba(0,0,0,.14),transparent 6%),repeating-linear-gradient(transparent 0 33px,rgba(110,140,170,.45) 33px 34px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 60%);
box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 90px rgba(150,100,40,.3)}
.leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;animation:flip 6s ease-in-out 86s both}
@keyframes flip{to{transform:rotateY(-180deg)}}
.face{backface-visibility:hidden}.back{transform:rotateY(180deg);background-image:linear-gradient(270deg,rgba(0,0,0,.14),transparent 6%),repeating-linear-gradient(transparent 0 33px,rgba(110,140,170,.35) 33px 34px)}
.en{position:absolute;right:40px;width:400px}
.dt{font-weight:600;font-size:25px;line-height:34px;white-space:nowrap}
.dt span{display:inline-block;padding:0 8px;background:linear-gradient(transparent 62%,rgba(217,122,31,.3) 62%)}
.ln{position:relative;width:max-content;font-size:19px;line-height:34px;white-space:nowrap}
.ln::after{content:"";position:absolute;top:12px;right:-3px;width:7px;height:7px;border-radius:50% 50% 50% 0;rotate:-45deg;background:#10142c;opacity:0;animation:nib var(--d) linear var(--t) both}
@keyframes nib{0%{opacity:0;right:-3px}1%{opacity:1}99%{opacity:1}100%{opacity:0;right:calc(100% - 4px)}}
.nt{display:inline-block;font-family:var(--ruq);font-size:24px;line-height:32px;color:var(--orange);border-bottom:3px double var(--orange);white-space:nowrap}
.dd{position:absolute;left:24px;width:276px;height:220px}
.dd svg{width:100%;height:100%;overflow:visible}
.dd path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--d,2s) ease-in-out var(--t,0s) both}
.dd path.o{stroke:var(--orange)}
@keyframes dr{to{stroke-dashoffset:0}}
.tx{position:absolute;transform:translateX(-50%);white-space:nowrap;font-family:var(--ruq);color:var(--ink)}.tx.o{color:var(--orange)}
.st{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #fffdf5;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;font-size:26px}
.tape{position:absolute;width:150px;height:38px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 8px,rgba(60,120,140,.4) 8px 16px);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ring{position:absolute;width:120px;height:120px;border-radius:50%;border:6px solid rgba(120,70,20,.22);box-shadow:inset 0 0 12px rgba(120,70,20,.15)}
.rv{clip-path:inset(0 0 0 100%);animation:rv var(--d,3s) linear var(--t,0s) both}
@keyframes rv{to{clip-path:inset(0 0 0 0)}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.3,1.6,.5,1) var(--t,0s) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.fd{opacity:0;animation:fd 2s ease-out var(--t,0s) both}
@keyframes fd{to{opacity:1}}
.paused *,.paused::before{animation-play-state:paused !important}
.rst *{animation:none !important}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 22% 24%,rgba(255,190,100,.34),transparent 52%);mix-blend-mode:screen;animation:fl 3.3s ease-in-out infinite alternate}
@keyframes fl{from{opacity:.5}to{opacity:1}}
.rays{position:absolute;inset:-20%;pointer-events:none;background:repeating-linear-gradient(112deg,transparent 0 90px,rgba(255,215,150,.07) 90px 150px);mask-image:radial-gradient(circle at 20% 15%,#000,transparent 70%);animation:dr2 26s ease-in-out infinite alternate}
@keyframes dr2{to{translate:80px 30px}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(4,3,10,.82) 100%)}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,225,160,.65);animation:fy var(--s) linear infinite}
@keyframes fy{from{transform:translate(0,40px);opacity:0}20%{opacity:.9}to{transform:translate(70px,-120vh);opacity:0}}
.card{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:14px;background:radial-gradient(circle,rgba(14,16,36,.9),#05040a);color:var(--gold);overflow:hidden}
.card h1{position:relative;font-family:var(--ruq);font-size:clamp(54px,12vw,130px);font-weight:700;line-height:1.1;text-shadow:0 0 30px rgba(230,170,70,.5)}
.card p{position:relative;font-size:clamp(18px,3vw,30px)}
.star{position:absolute;left:50%;top:50%;width:min(60vmin,420px);height:min(60vmin,420px);translate:-50% -50%;animation:sp 60s linear infinite}
.star::before,.star::after{content:"";position:absolute;inset:14%;border:2px solid rgba(230,194,122,.35)}
.star::after{rotate:45deg}
@keyframes sp{to{rotate:360deg}}
#intro{opacity:0;pointer-events:none;animation:intro 12s ease-in-out both}
@keyframes intro{0%{opacity:0}8%,68%{opacity:1}100%{opacity:0}}
#outro{opacity:0;pointer-events:none;animation:fd 3s ease-out 170s both}
#bar{position:absolute;left:0;bottom:0;height:4px;width:100%;transform-origin:right;background:var(--gold);transform:scaleX(0);animation:pr 180s linear both}
@keyframes pr{to{transform:scaleX(1)}}
#ctl{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));translate:-50% 0;display:flex;gap:10px;z-index:5}
#ctl button{font:inherit;font-size:20px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(230,194,122,.6);background:rgba(10,10,24,.75);color:var(--gold);cursor:pointer}
#ctl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dust,.rays{display:none}}
</style>
</head>
<body>
<div id="desk">
  <div id="cam"><div class="book">
    <div class="cover"></div><div class="prev"></div><div class="roll"></div><div class="inkpot"></div>
    <div class="page" id="pgB"></div>
    <div class="leaf"><div class="face" id="pgA"></div><div class="face back"></div></div>
  </div></div>
  <div class="rays"></div><div class="glow"></div><div class="dust" id="dust"></div><div class="vig"></div>
  <div class="card" id="intro"><div class="star"></div><h1>بيت الحكمة</h1><p>بغداد · القرن الثامن إلى التاسع الميلادي</p></div>
  <div class="card" id="outro"><div class="star"></div><h1>العلم رحلة لا تنتهي</h1><p>من بغداد إلى الأندلس ثم إلى أوروبا</p></div>
  <div id="bar"></div>
  <div id="ctl"><button id="pp" aria-label="إيقاف مؤقت">❚❚</button><button id="rp" aria-label="إعادة من البداية">↻</button></div>
</div>
<script>
const $=(h,p)=>{const d=document.createElement('div');d.innerHTML=h;const e=d.firstElementChild;p.appendChild(e);return e};
const st=(t,d)=>`--t:${t}s;--d:${d}s`;
const D={
city:['M55 120a95 95 0 1 0 190 0a95 95 0 1 0 -190 0','M88 120a62 62 0 1 0 124 0a62 62 0 1 0 -124 0','M126 120a24 24 0 1 0 48 0a24 24 0 1 0 -48 0','M150 25V45M150 195V215M55 120H35M245 120H265','M150 58V96M150 144V182M88 120H126M174 120H212','M138 120Q150 96 162 120','o:M150 100V90','o:M10 205Q40 192 70 205T130 205T190 205T250 205T290 205','o:M20 222Q50 210 80 222T140 222T200 222T260 222','o:M262 40a14 14 0 1 0 8 24a11 11 0 1 1 -8 -24z'],
books:['M40 200H200V180H40Z','M50 180H190V158H50Z','M60 158H180V138H60Z','M70 190H90M100 190H120M70 169H88M110 169H140M80 148H100','o:M175 138V118L182 126L189 118V138','M230 200V140H254V200Z','M242 140V130','o:M242 130Q232 116 242 98Q252 116 242 130Z','M222 200H262','o:M215 112L205 102M270 112L280 102M242 88V76','M272 222Q287 172 294 150Q278 160 272 222Z','M274 218L262 232'],
trans:['M14 62H116M14 178H116','M20 70H110V170H20Z','M30 100H100M30 118H92M30 136H100M30 154H86','o:M125 120H180M168 106L184 120L168 134','M184 62H286M184 178H286','M190 70H280V170H190Z','M270 100H206M270 118H214M270 136H206M270 154H220','M120 200h60v28h-60zM140 200V190H160V200','o:M170 190L204 150'],
eq:['M32 20H268Q280 20 280 32V140Q280 152 268 152H110L80 190L86 152H32Q20 152 20 140V32Q20 20 32 20Z','o:M40 130H260','o:M250 42l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z','M180 215H266M223 215V172M190 172H256','o:M190 172L180 198H200ZM256 172L246 198H266Z','M200 215L190 232M246 215L256 232'],
astro:['M30 120a90 90 0 1 0 180 0a90 90 0 1 0 -180 0','M50 120a70 70 0 1 0 140 0a70 70 0 1 0 -140 0','M92 120a28 28 0 1 0 56 0a28 28 0 1 0 -56 0','M120 30V210M30 120H210','M120 30V40M120 200V210M30 120H40M200 120H210M56 56L63 63M184 56L177 63M56 184L63 177M184 184L177 177','o:M60 180L180 60','o:M112 20a8 8 0 1 0 .1 0','o:M262 150a22 22 0 1 0 12 38a18 18 0 1 1 -12 -38z','o:M255 60l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z'],
route:['o:M250 150Q215 190 170 175','o:M170 175Q110 200 50 160','o:M50 160Q40 110 80 72','M244 150a6 6 0 1 0 .1 0','M164 175a6 6 0 1 0 .1 0','M44 160a6 6 0 1 0 .1 0','M74 72a6 6 0 1 0 .1 0','M20 130Q70 118 125 140T225 128','M110 212h34l-7 14h-20zM127 212V190l16 18z','o:M262 40a14 14 0 1 0 8 24a11 11 0 1 1 -8 -24z']};
const TX={city:[[150,-4,'المدينة المدورة',18,1]],trans:[[65,98,'α',40],[235,98,'أ',44],[150,38,'ترجمة',22,1]],eq:[[150,38,'س + ٣ = ٧',34],[150,92,'س = ؟',24,1],[223,0,'ميزان',16,1]],astro:[[258,112,'الإسطرلاب',17,1]],route:[[250,162,'بغداد',16,1],[170,188,'القاهرة',16,1],[50,176,'قرطبة',16,1],[80,48,'أوروبا',16,1]]};
const A=[
{t:14,top:102,dt:'القرن 8م',L:['بُنيت بغداد عام 762م على نهر دجلة،','فصارت ملتقى التجار والعلماء.'],n:'مدينة تحب الكتب!',k:'city',s:['📜',540]},
{t:38,top:408,dt:'نحو 800م',L:['جُمعت المخطوطات النادرة من الشام','وفارس والهند واليونان إلى بغداد.'],n:'كل كتاب كنز!',k:'books',s:['🕯️',70]},
{t:62,top:714,dt:'813–833م',L:['ازدهرت الترجمة في عهد المأمون،','ويُنسب إلى بيت الحكمة دور كبير فيها.'],n:'الترجمة جسر بين الحضارات.',k:'trans',s:['📚',430]}];
const B=[
{t:96,top:102,dt:'نحو 820م',L:['ألّف الخوارزمي كتابه في الجبر والمقابلة،','ومن اسمه جاءت كلمة «الخوارزمية».'],n:'علم جديد باسم عربي!',k:'eq',s:['🧮',540]},
{t:122,top:408,dt:'الفلك',L:['رصد علماء المأمون النجوم، وقاسوا','درجة من محيط الأرض في سهل سنجار.'],n:'السماء مفتوحة للجميع!',k:'astro',s:['🌙',70]},
{t:148,top:714,dt:'الأثر',L:['انتقلت هذه المعارف إلى الأندلس ثم أوروبا،','وبقيت كلماتها: جبر، خوارزمية، صفر.'],n:'العلم رحلة لا تنتهي.',k:'route',s:['🌍',430]}];
function build(pg,E){
 $(`<div class="tape fd" style="left:300px;top:-16px;rotate:-3deg;${st(E[0].t-4,2)}"></div>`,pg);
 E.forEach(e=>{
  const en=$(`<div class="en" style="top:${e.top}px"></div>`,pg);
  $(`<div class="dt"><span class="rv" style="${st(e.t,1.8)}">${e.dt}</span></div>`,en);
  let c=e.t+2.4;
  e.L.forEach(l=>{$(`<div class="ln" style="${st(c,3.8)}"><span class="rv" style="${st(c,3.8)}">${l}</span></div>`,en);c+=4.4});
  $(`<div class="nt rv" style="${st(c+.4,2.6)}">${e.n}</div>`,en);
  const dd=$(`<div class="dd" style="top:${e.top}px"></div>`,pg);
  let s='<svg viewBox="0 0 300 240">';
  D[e.k].forEach((p,i)=>{const o=p.startsWith('o:');s+=`<path pathLength="1" class="${o?'o':''}" d="${o?p.slice(2):p}" style="${st(e.t+3+i*1.3,2.4)}"/>`});
  dd.innerHTML=s+'</svg>';
  (TX[e.k]||[]).forEach(([x,y,t,z,o],i)=>$(`<div class="tx ${o?'o':''} rv" style="left:${x/3}%;top:${y/2.4}%;font-size:${z}px;${st(e.t+17+i*1.2,1.6)}">${t}</div>`,dd));
  $(`<div class="st pop" style="left:${e.s[1]}px;top:${e.top+238}px;--r:${e.s[1]>300?7:-7}deg;${st(e.t+21,.8)}">${e.s[0]}</div>`,pg);
 });
}
build(document.getElementById('pgA'),A);build(document.getElementById('pgB'),B);
$(`<div class="ring fd" style="left:590px;top:930px;${st(100,3)}"></div>`,document.getElementById('pgB'));
const dust=document.getElementById('dust');
for(let i=0;i<40;i++){const d=document.createElement('i');d.style.cssText=`left:${Math.random()*100}%;top:${50+Math.random()*50}%;--s:${14+Math.random()*18}s;animation-delay:-${Math.random()*24}s`;dust.appendChild(d)}
const kf=document.createElement('style');document.head.appendChild(kf);
function cam(){
 const vw=innerWidth,vh=innerHeight,s0=Math.min(vw*.9/760,vh*.88/1060),fs=Math.min(vw*.95/740,vh*.8/300);
 const at=(cx,cy,s)=>`translate(${vw/2-cx*s}px,${vh/2-cy*s}px) scale(${s})`;
 const ov=at(380,530,s0),f=e=>at(380,e.top+110,fs),p=x=>(x/1.8).toFixed(2)+'%';
 const F=[[16,36,A[0]],[40,60,A[1]],[64,82,A[2]],[98,120,B[0]],[124,146,B[1]],[150,168,B[2]]];
 let k=`0%,${p(9)}{transform:${ov}}`;F.forEach(([a,b,e])=>k+=`${p(a)},${p(b)}{transform:${f(e)}}`);
 k=k.replace(`${p(82)}{`,`${p(82)}{`)+`${p(87)},${p(93)}{transform:${at(380,530,s0*1.05)}}${p(177)},100%{transform:${ov}}`;
 kf.textContent=`@keyframes cam{${k}}`;
}
cam();addEventListener('resize',cam);
const d=document.getElementById('desk'),pp=document.getElementById('pp');
pp.onclick=()=>{const q=d.classList.toggle('paused');pp.textContent=q?'▶':'❚❚';pp.setAttribute('aria-label',q?'متابعة':'إيقاف مؤقت')};
document.getElementById('rp').onclick=()=>{d.classList.remove('paused');pp.textContent='❚❚';d.classList.add('rst');void d.offsetWidth;d.classList.remove('rst')};
</script>
</body>
</html>
