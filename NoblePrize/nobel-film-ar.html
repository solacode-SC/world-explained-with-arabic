<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>جائزة نوبل — فيلم متحرك</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&amp;family=Cairo:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ol:#6b7347;--ink:#3b3f26;--cr:#f7f0dd;--or:#ee7d1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;font-family:Cairo,system-ui,sans-serif;font-weight:600;color:var(--ink);background:linear-gradient(rgba(110,100,60,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(110,100,60,.16) 1px,transparent 1px),#f3ead3;background-size:22px 22px}
#desk{flex:1;position:relative;display:grid;place-items:center;padding:10px;min-height:0}
.ic{position:absolute;display:none;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
.ic i{width:54px;height:42px;background:#f6df73;border:3px solid var(--ink);border-radius:6px}.ic i.hh{background:var(--ol);color:#fff;font:700 28px 'Reem Kufi';font-style:normal;display:grid;place-items:center;height:54px;border-radius:12px}
.l1{top:9%;left:3%}.l2{top:30%;left:3%}.r1{top:9%;right:3%}.r2{top:30%;right:3%}
@media(min-width:960px){.ic{display:flex}}
.win{width:min(94vw,820px);border:3px solid var(--ink);border-radius:14px;background:var(--cr);overflow:hidden;box-shadow:6px 6px 0 rgba(59,63,38,.25)}
.win.on{animation:win .5s both}@keyframes win{from{opacity:0;transform:scale(.9)}}
.tb{background:var(--ol);color:var(--cr);padding:7px 14px;display:flex;justify-content:space-between;align-items:center;font:700 clamp(13px,2.2vw,18px) 'Courier New',monospace;direction:ltr}
.tb i{font-style:normal;background:#f0646a;border:2px solid var(--ink);border-radius:5px;width:24px;height:22px;display:grid;place-items:center;color:#fff}
.bd{position:relative;padding:26px clamp(10px,2.5vw,22px) 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bd::before{content:"";position:absolute;top:0;left:7%;right:7%;height:12px;background:#f4b57c}
.hk{background:var(--or);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:1px 16px;font-size:clamp(14px,2.6vw,20px);animation:up .6s .3s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
canvas{width:auto;height:auto;max-width:100%;max-height:42vh}
#cap{position:relative;width:100%;box-sizing:border-box;background:#fff8e6;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;min-height:3.7em;font-size:clamp(15px,2.6vw,22px);margin-top:8px}
#cap::before{content:"";position:absolute;top:-12px;width:16px;height:16px;background:#fff8e6;border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg)}
#cap.N::before{left:10%}#cap.A::before{right:10%}
#nm{display:inline-block;color:#fff;border-radius:999px;padding:0 12px;margin-inline-end:10px;font-size:.85em}
#st{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(243,234,211,.92);text-align:center}
#st div{background:var(--cr);border:3px solid var(--ink);border-radius:16px;padding:22px 26px;max-width:min(90vw,440px);box-shadow:6px 6px 0 rgba(59,63,38,.25)}
#st h1{font:700 clamp(32px,7.5vw,52px) 'Reem Kufi';color:var(--or);margin:0}#st p{margin:6px 0 14px}
#st small{display:block;margin-top:10px;opacity:.85;font-size:13px;color:#5a3f12}
.go{background:var(--ol);color:var(--cr);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font:700 17px Cairo;cursor:pointer;margin:4px}
#tk{background:var(--ol);border-top:3px solid var(--ink);display:flex;align-items:center;gap:clamp(6px,2vw,12px);padding:10px 12px}
.tbn{width:clamp(38px,9vw,48px);aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;font:700 18px 'Reem Kufi';cursor:pointer;color:#fff;flex:none}
.tbn:focus-visible,.go:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
#tr{flex:1;height:12px;border-radius:9px;background:rgba(247,240,221,.25);cursor:pointer;overflow:hidden}
#fl{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b57,#ffd166,#2ee6c5)}
@media(prefers-reduced-motion:reduce){.win.on{animation:none}}
</style></head><body>

<div id="st"><div><h1>جائزة نوبل 🏅</h1><p>فيلم متحرك متكامل مع أصوات عربية استوديو وشخصيات متفاعلة</p><button class="go" id="g1">ابدأ مع الصوت 🔊</button><button class="go" id="g0">ابدأ بدون صوت</button><small>🎙️ تم توليد أصوات استوديو عربية لنورا وألفريد مع تزامن الشفاه</small></div></div>

function drawNora(cx, cy, tk, t) {
  const y = cy + Math.sin(t * 2.5) * 4;
  const tilt = Math.sin(t * 1.6) * 0.025;
  const bl = (t + 0.3) % 3.6 < 0.14;

  x.save();
  x.translate(cx, y);
  x.rotate(tilt);

  const w = 142, h = 222;
  const x0 = -w / 2;
  const y0 = -110;

  if (imgN.complete && imgN.naturalWidth > 0) {
    // Soft shadow
    x.save();
    x.beginPath();
    x.ellipse(0, 108, 42, 9, 0, 0, Math.PI * 2);
    x.fillStyle = 'rgba(238, 125, 26, 0.2)';
    x.fill();
    x.restore();

    // Draw sprite
    x.drawImage(imgN, x0, y0, w, h);

    // Dynamic animated face features over sprite face
    const eyeLX = x0 + 74.4;
    const eyeRX = x0 + 94.6;
    const eyeY = y0 + 63.5;
    const mouthX = x0 + 84.5;
    const mouthY = y0 + 74.8;

    if (bl) {
      x.beginPath();
      x.arc(eyeLX, eyeY, 3.8, 0.15 * Math.PI, 0.85 * Math.PI);
      x.strokeStyle = '#2b1a23'; x.lineWidth = 2.4; x.lineCap = 'round'; x.stroke();
      x.beginPath();
      x.arc(eyeRX, eyeY, 3.8, 0.15 * Math.PI, 0.85 * Math.PI);
      x.strokeStyle = '#2b1a23'; x.lineWidth = 2.4; x.lineCap = 'round'; x.stroke();
    } else {
      [eyeLX, eyeRX].forEach(ex => {
        x.beginPath();
        x.ellipse(ex, eyeY, 4.2, 5.8, 0, 0, Math.PI * 2);
        x.fillStyle = '#2c1924'; x.fill();
        ci(ex - 1.2, eyeY - 2.2, 1.8, '#ffffff');
        ci(ex + 1.4, eyeY + 1.8, 1.0, '#ffffff');
        x.beginPath();
        x.arc(ex, eyeY - 2.5, 4.8, 1.15 * Math.PI, 1.85 * Math.PI);
        x.strokeStyle = '#2c1924'; x.lineWidth = 2.0; x.lineCap = 'round'; x.stroke();
      });
    }

    // Eyebrows
    x.beginPath(); x.arc(eyeLX, eyeY - 7, 4.5, 1.2 * Math.PI, 1.8 * Math.PI);
    x.strokeStyle = 'rgba(180, 80, 100, 0.65)'; x.lineWidth = 1.6; x.lineCap = 'round'; x.stroke();
    x.beginPath(); x.arc(eyeRX, eyeY - 7, 4.5, 1.2 * Math.PI, 1.8 * Math.PI);
    x.strokeStyle = 'rgba(180, 80, 100, 0.65)'; x.lineWidth = 1.6; x.lineCap = 'round'; x.stroke();

    // Animated mouth
    if (tk) {
      const openH = 2.5 + 4.5 * Math.abs(Math.sin(t * 16));
      x.beginPath();
      x.ellipse(mouthX, mouthY + openH * 0.25, 4.4, openH, 0, 0, Math.PI * 2);
      x.fillStyle = '#cf4871'; x.fill();
      x.strokeStyle = '#5a192d'; x.lineWidth = 1.4; x.stroke();
      x.beginPath();
      x.arc(mouthX, mouthY - 0.5, 2.5, 0, Math.PI);
      x.fillStyle = '#ffffff'; x.fill();
    } else {
      x.beginPath();
      x.arc(mouthX, mouthY - 2, 3.8, 0.2 * Math.PI, 0.8 * Math.PI);
      x.strokeStyle = '#a83b58'; x.lineWidth = 2.0; x.lineCap = 'round'; x.stroke();
    }

    // Sparkles when talking
    if (tk) {
      tt('✦', x0 + 12 + Math.cos(t * 3) * 8, y0 - 8 + Math.sin(t * 4) * 6, 13, '#ffd166', 0.85, 'sans-serif');
      tt('✨', x0 + w - 10, y0 + 35 + Math.sin(t * 3.5) * 6, 13, '#f08cc0', 0.85, 'sans-serif');
    }
  } else {
    drawNoraVector(x0, y0, tk, t, bl);
  }
  x.restore();
}

function drawNoraVector(x0, y0, tk, t, bl) {
  x.save();
  x.beginPath(); x.ellipse(0, 105, 38, 8, 0, 0, Math.PI * 2);
  x.fillStyle = 'rgba(238, 125, 26, 0.15)'; x.fill();

  x.beginPath(); x.moveTo(-28, 40); x.quadraticCurveTo(-45, 80, -38, 105);
  x.lineTo(38, 105); x.quadraticCurveTo(45, 80, 28, 40); x.closePath();
  x.fillStyle = '#ffffff'; x.fill(); x.strokeStyle = '#5a3d45'; x.lineWidth = 3; x.stroke();

  x.beginPath(); x.moveTo(-26, 40); x.quadraticCurveTo(-38, 75, -28, 105);
  x.lineTo(-14, 105); x.quadraticCurveTo(-20, 75, -12, 40); x.closePath();
  x.fillStyle = '#f8a5c2'; x.fill();
  x.beginPath(); x.moveTo(26, 40); x.quadraticCurveTo(38, 75, 28, 105);
  x.lineTo(14, 105); x.quadraticCurveTo(20, 75, 12, 40); x.closePath();
  x.fillStyle = '#f8a5c2'; x.fill();

  const slv = Math.sin(t * 3) * 6;
  x.beginPath(); x.moveTo(-24, 45); x.quadraticCurveTo(-65, 55 + slv, -55, 95);
  x.quadraticCurveTo(-35, 85, -20, 68); x.fillStyle = '#ffffff'; x.fill();
  x.strokeStyle = '#f8a5c2'; x.lineWidth = 4; x.stroke();
  x.beginPath(); x.moveTo(24, 45); x.quadraticCurveTo(65, 55 - slv, 55, 95);
  x.quadraticCurveTo(35, 85, 20, 68); x.fillStyle = '#ffffff'; x.fill();
  x.strokeStyle = '#f8a5c2'; x.lineWidth = 4; x.stroke();

  rr(-20, 36, 40, 10, 4, '#e65c9c'); ci(0, 42, 4, '#ffd166'); ci(0, 48, 3, '#ffffff');
  ci(-12, 106, 6, '#f8a5c2'); ci(12, 106, 6, '#f8a5c2');

  ci(0, 0, 42, '#fae1d3', '#5a3d45', 3.5);

  ci(-34, -28, 20, '#f9a8c6', '#5a3d45', 3.5); ci(34, -28, 20, '#f9a8c6', '#5a3d45', 3.5);
  ci(-34, -28, 8, '#ffffff'); ci(-34, -36, 4, '#ffd166');
  ci(34, -28, 8, '#ffffff'); ci(34, -36, 4, '#ffd166');
  ln(-38, -12, -44, 45 + Math.sin(t*3)*5, '#f8a5c2', 4);
  ln(38, -12, 44, 45 - Math.sin(t*3)*5, '#f8a5c2', 4);

  x.beginPath(); x.arc(0, -6, 43, Math.PI * 1.05, Math.PI * 1.95);
  x.lineTo(26, -6); x.lineTo(-26, -6); x.closePath();
  x.fillStyle = '#f9a8c6'; x.fill(); x.strokeStyle = '#5a3d45'; x.lineWidth = 3.5; x.stroke();

  [-15, 15].forEach(s => {
    if (bl) {
      x.beginPath(); x.arc(s, -2, 4, 0.15*Math.PI, 0.85*Math.PI);
      x.strokeStyle = '#2d1b24'; x.lineWidth = 2.4; x.lineCap = 'round'; x.stroke();
    } else {
      x.beginPath(); x.ellipse(s, -2, 4.2, 5.5, 0, 0, Math.PI*2);
      x.fillStyle = '#2d1b24'; x.fill(); ci(s-1.2, -4, 1.8, '#ffffff'); ci(s+1.2, 0, 1.0, '#ffffff');
    }
  });
  if (tk) {
    x.beginPath(); x.ellipse(0, 16, 5, 2.5 + 4.5*Math.abs(Math.sin(t*16)), 0, 0, Math.PI*2);
    x.fillStyle = '#cc4b6f'; x.fill(); x.strokeStyle = '#5c1b2f'; x.lineWidth = 1.4; x.stroke();
  } else {
    x.beginPath(); x.arc(0, 14, 4, 0.2*Math.PI, 0.8*Math.PI);

function drawAlfred(cx, cy, tk, t) {
  const y = cy + Math.sin(t * 2 + 2) * 3;
  const bl = (t + 1.3) % 3.4 < 0.12;

  x.beginPath(); x.ellipse(0, 145, 45, 10, 0, 0, Math.PI * 2);

  ln(40, 62, tk ? 68 : 62, ay - 4, cb, 16);
  ci(-62, 112, 9, sk, O, 3);
  ci(tk ? 68 : 62, ay, 9, sk, O, 3);

  rr(-42, 38, 84, 100, 22, cb);
  ln(-15, 75, -5, 95, '#ffd166', 3);
  ln(-5, 95, 10, 80, '#ffd166', 3);
  ci(18, 62, 6, '#ee7d1a', O, 2);

  x.beginPath(); x.moveTo(-16, 40); x.lineTo(0, 58); x.lineTo(16, 40);
  x.fillStyle = '#ffffff'; x.fill(); ci(0, 48, 4, '#ee7d1a');

  ci(0, 0, 48, sk, O, 4);
  x.beginPath(); x.ellipse(0, 18, 42, 50, 0, 0, Math.PI);
  x.fillStyle = '#ffffff'; x.fill(); x.strokeStyle = O; x.lineWidth = 4; x.stroke();
  x.beginPath(); x.arc(0, -6, 50, Math.PI * 1.04, Math.PI * 1.96);
  x.fillStyle = '#e8edf0'; x.fill(); x.strokeStyle = O; x.lineWidth = 4; x.stroke();

  [-18, 18].forEach(s => {
    x.beginPath(); x.ellipse(s, -2, 5, bl ? 1 : 6, 0, 0, Math.PI * 2);
    x.fillStyle = O; x.fill();
    ci(s, -2, 13, 0, O, 3);
  });
  ln(-5, -2, 5, -2, O, 3);

  if (tk) {
    x.beginPath();
    x.ellipse(0, 26, 10, 4 + 9 * Math.abs(Math.sin(t * 14 + 1)), 0, 0, Math.PI * 2);
    x.fillStyle = '#8a2f2f'; x.fill(); x.strokeStyle = O; x.lineWidth = 3; x.stroke();
  } else {
    x.beginPath(); x.arc(0, 18, 10, 0.2, 2.9);
    x.strokeStyle = O; x.lineWidth = 4; x.stroke();
  }
  x.restore();
}

function ch(cx, cy, k, tk, t) {

}

function show(i){cur=i;$('ttl').textContent='C:\\NOBEL\\'+T0[i];hk.textContent=HK[i];hk.style.animation='none';void hk.offsetWidth;hk.style.animation='';win.classList.remove('on');void win.offsetWidth;win.classList.add('on')}
function sync(){
  $('pb').textContent=T>=TOT?'↺':pl?'⏸':'▶';
  $('sn').textContent=snd?'🔊':'🔇';
  if(currentAudio){
    if(pl&&currentAudio.paused)currentAudio.play().catch(()=>{});
    else if(!pl&&!currentAudio.paused)currentAudio.pause();
  }
}
function seek(v){
  T=cl(v,0,TOT-.01);
  key='';
  stopAudio();
}
const sc=()=>{let i=0;while(i<11&&T>=S[i]+D[i])i++;return i};
function start(s){snd=s;pl=true;key='';$('st').remove();sync()}
$('g1').onclick=()=>start(true);$('g0').onclick=()=>start(false);
$('pb').onclick=()=>{if(T>=TOT){seek(0);pl=true}else{pl=!pl;if(pl)key=''}sync()};
$('pv').onclick=()=>{const i=sc();seek(S[T-S[i]>3?i:Math.max(0,i-1)]);sync()};
$('nx').onclick=()=>{seek(S[Math.min(11,sc()+1)]);sync()};
$('sn').onclick=()=>{snd=!snd;if(!snd)stopAudio();else{key='';}sync()};

addEventListener('keydown',e=>{if(e.code==='Space'&&!$('st')&&e.target===document.body){e.preventDefault();$('pb').click()}});

function loop(n){
  const dt=Math.min(.1,(n-L)/1000);L=n;
  if(pl){T=Math.min(TOT-.001,T+dt);if(T>=TOT-.001){pl=false;T=TOT;stopAudio();sync()}}
  const i=sc(),t=T-S[i];if(i!==cur)show(i);
  x.clearRect(0,0,800,360);F[i](t);

  const ls=CP[i];let li=0;
  for(let k=0;k<ls.length;k++)if(ls[k][0]<=t)li=k;
  const Ln=ls[li],k=i+':'+li;

  const isLineActive=t>=Ln[0]&&t<Ln[0]+(Ln[3]||4.5);
  const isAudioPlaying=currentAudio&&!currentAudio.paused&&!currentAudio.ended;
  const isTalking=pl&&(isAudioPlaying||isLineActive);

  ch(100,200,0,isTalking&&Ln[1]=='N',t);
  ch(700,200,1,isTalking&&Ln[1]=='A',t);

  if(k!==key){
    key=k;
    nm.textContent=Ln[1]=='N'?'نورا':'ألفريد';
    nm.style.background=Ln[1]=='N'?'#e65c9c':'#4a5230';
    cap.className=Ln[1];
    tx.textContent=Ln[2];
    cap.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:400,easing:'ease-out'});
    playDialogueAudio(i,li,Ln[2],Ln[1]);
  }
  $('fl').style.width=T/TOT*100+'%';
  requestAnimationFrame(loop);
}
sync();requestAnimationFrame(loop);
