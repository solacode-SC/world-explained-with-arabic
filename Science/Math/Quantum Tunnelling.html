<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quantum Tunnelling: Through the Wall</title><style>:root{--bg:#f6f1e6;--card:#efe8d8;--ink:#1c2a44;--mute:#52607a;--o:#d9572b;--t:#1a9aa8;--v:#7c5cc4;--line:#c9bfa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#161d30;--ink:#eef1f8;--mute:#9aa6c2;--o:#ff8a52;--t:#3fd0de;--v:#b79cff;--line:#2c3656;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#161d30;--ink:#eef1f8;--mute:#9aa6c2;--o:#ff8a52;--t:#3fd0de;--v:#b79cff;--line:#2c3656;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:10px 12px}
h1{font-size:clamp(20px,3.6vw,34px);text-align:center;margin:0;letter-spacing:-.02em;line-height:1.15}
.sub{text-align:center;color:var(--mute);font-size:clamp(12px,1.7vw,16px);margin:2px 0 8px}.sub b{color:var(--o)}
.row{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.p{background:var(--card);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;min-height:0;min-width:0}
.hd{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}.hd h2{margin:0;font-size:clamp(14px,1.9vw,18px)}
.fm{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,2.2vw,22px)}
.ds{font-size:12px;color:var(--mute);width:100%}
.cv{position:relative;flex:1;min-height:0}.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.val{font-family:Georgia,serif;font-size:clamp(12px,1.5vw,15px);color:var(--mute);text-align:center}.val b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:12px;padding-top:8px;font-size:14px;color:var(--mute)}
.bar label{flex:1;display:flex;align-items:center;gap:10px}.bar label b{color:var(--ink);min-width:3ch}
input[type=range]{flex:1;accent-color:var(--o)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
@media(max-width:700px){.row{grid-template-columns:1fr;grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:6px}.ds{display:none}.p{padding:6px 10px}}
@media(max-height:520px){.sub{display:none}}</style></head><body>
<h1>Quantum Tunnelling: Through the Wall</h1><p class="sub">A particle with <b>less energy than the barrier</b> can still appear on the other side. A thinner wall means more get through.</p><div class="row" id="row"></div>
<div class="bar"><label>Barrier width L <b id="nv"></b><input id="n" type="range" min="0.2" max="3" step="0.1" value="1"></label><button id="au">Auto: on</button></div>
<script>
var $=function(i){return document.getElementById(i)},PN=[["o", "The wave", "ψ(x,t)", "The wave oscillates, decays inside the wall, and a smaller wave leaks out."], ["t", "Transmission", "T(L) ≈ e^(−2κL)", "Wider wall, exponentially fewer particles pass."], ["v", "Particles", "T = chance", "Each particle passes with probability T."]];
$('row').style.setProperty('--n',PN.length);
$('row').innerHTML=PN.map(function(p,i){return '<section class="p"><div class="hd"><h2 style="color:var(--'+p[0]+')">'+p[1]+'</h2><span class="fm">'+p[2]+'</span><span class="ds">'+p[3]+'</span></div><div class="cv"><canvas id="c'+i+'"></canvas></div><div class="val" id="v'+i+'"></div></section>'}).join('');
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
var cvs=PN.map(function(p,i){return $('c'+i)}),cx=cvs.map(function(c){return c.getContext('2d')}),sz=PN.map(function(){return[300,300]});
var ro=new ResizeObserver(function(){cvs.forEach(function(c,i){var b=c.parentNode.getBoundingClientRect(),d=window.devicePixelRatio||1;sz[i]=[b.width,b.height];c.width=Math.max(1,b.width*d);c.height=Math.max(1,b.height*d);cx[i].setTransform(d,0,0,d,0,0)})});
cvs.forEach(function(c){ro.observe(c.parentNode)});
function txt(c,s,x,y,col,z,al){c.fillStyle=col;c.font='italic '+(z||14)+'px Georgia,serif';c.textAlign=al||'center';c.fillText(s,x,y)}
function arrow(c,x1,y1,x2,y2,col,lw){if(Math.hypot(x2-x1,y2-y1)<4)return;c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||2.5;c.setLineDash([]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();var a=Math.atan2(y2-y1,x2-x1),k=Math.min(10,3+lw*2);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-k*Math.cos(a-.4),y2-k*Math.sin(a-.4));c.lineTo(x2-k*Math.cos(a+.4),y2-k*Math.sin(a+.4));c.fill();c.restore()}
var V0=2.5,E0=1,KA=1,KP=Math.sqrt(V0-E0),SH=[],nt=0,nr=0,lastL=-1,tm=0;
function TT(L){var s=Math.sinh(KP*L);return 1/(1+V0*V0*s*s/(4*E0*(V0-E0)))}
var DR=[function(c,w,h,L,T,C){var x0=-6,x1=L+6,X=function(x){return(x-x0)/(x1-x0)*w},ys=(h-60)/3.2,yE=function(v){return h-22-v*ys},Ty=TT(L),R=1-Ty,om=2*T;
c.fillStyle=C.v;c.globalAlpha=.28;c.fillRect(X(0),yE(V0),X(L)-X(0),yE(0)-yE(V0));c.globalAlpha=1;
c.strokeStyle=C.mute;c.lineWidth=1.5;c.beginPath();c.moveTo(0,yE(0));c.lineTo(w,yE(0));c.stroke();
c.save();c.setLineDash([5,5]);c.beginPath();c.moveTo(0,yE(E0));c.lineTo(w,yE(E0));c.stroke();c.restore();
txt(c,'E',8,yE(E0)-5,C.mute,13,'left');txt(c,'V₀',X(L/2),yE(V0)-5,C.v,13);
c.strokeStyle=C.o;c.lineWidth=3;c.beginPath();for(var i=0;i<=300;i++){var x=x0+(x1-x0)*i/300,p;
if(x<0)p=Math.cos(KA*x-om)+Math.sqrt(R)*Math.cos(KA*x+om);else if(x<=L)p=(1+Math.sqrt(R))*Math.exp(-KP*x)*Math.cos(om);else p=Math.sqrt(Ty)*Math.cos(KA*(x-L)-om);
var y=yE(E0)-p*.55*ys;i?c.lineTo(X(x),y):c.moveTo(X(x),y)}c.stroke();
return 'E = 1 &lt; V₀ = 2.5: classically blocked · κ = <b>'+KP.toFixed(2)+'</b>'},
function(c,w,h,L,T,C){var l=30,r=12,t=14,b=24,X=function(x){return l+x/3.2*(w-l-r)},Y=function(v){return h-b-v*(h-t-b)};
c.strokeStyle=C.line;c.lineWidth=1.5;c.beginPath();c.moveTo(l,t);c.lineTo(l,h-b);c.lineTo(w-r,h-b);c.stroke();
c.save();c.setLineDash([5,5]);c.strokeStyle=C.mute;c.beginPath();for(var i=0;i<=100;i++){var x=3.2*i/100,v=Math.min(1,3.84*Math.exp(-2*KP*x));i?c.lineTo(X(x),Y(v)):c.moveTo(X(x),Y(v))}c.stroke();c.restore();
c.strokeStyle=C.t;c.lineWidth=3;c.beginPath();for(var i=0;i<=100;i++){var x=3.2*i/100;i?c.lineTo(X(x),Y(TT(x))):c.moveTo(X(x),Y(TT(x)))}c.stroke();
c.fillStyle=C.o;c.beginPath();c.arc(X(L),Y(TT(L)),6,0,7);c.fill();
txt(c,'L',w-r,h-6,C.mute,13,'right');txt(c,'T',l+10,t+8,C.mute,13);txt(c,'1',l-10,Y(1)+4,C.mute,12);txt(c,'0',l-10,Y(0)+4,C.mute,12);
return 'T = <b>'+(TT(L)*100).toFixed(1)+'%</b> of particles get through'},
function(c,w,h,L,T,C,dt){if(Math.abs(L-lastL)>1e-6){lastL=L;nt=0;nr=0;SH=[]}var Ty=TT(L),x0=-6,x1=L+6,X=function(x){return(x-x0)/(x1-x0)*w};tm+=dt;
if(tm>.16){tm=0;SH.push({x:-5.6,v:2.6,y:.12+.76*Math.random(),d:0})}
c.fillStyle=C.v;c.globalAlpha=.28;c.fillRect(X(0),0,X(L)-X(0),h);c.globalAlpha=1;
SH=SH.filter(function(p){p.x+=p.v*dt;if(!p.d&&p.x>=0){if(Math.random()<Ty){p.d=1;nt++}else{p.d=2;p.v=-p.v;nr++}}return p.x>x0-.6&&p.x<x1+.6});
SH.forEach(function(p){c.fillStyle=p.d==2?C.o:(p.d==1?C.t:C.ink);c.globalAlpha=p.d==1&&p.x<L?.45:1;c.beginPath();c.arc(X(p.x),p.y*h,5,0,7);c.fill()});c.globalAlpha=1;
return 'passed <b>'+nt+'</b> of '+(nt+nr)+' · observed '+(nt+nr?(nt/(nt+nr)*100).toFixed(0):0)+'% vs T = <b>'+(Ty*100).toFixed(1)+'%</b>'}];
function AU(T){return 1.6+1.3*Math.sin(T*.2)}
var T=0,last=0,auto=true;
$('au').onclick=function(){auto=!auto;this.textContent='Auto: '+(auto?'on':'off')};
$('n').addEventListener('input',function(){auto=false;$('au').textContent='Auto: off'});
function fr(ts){var dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;T+=dt;if(auto)$('n').value=AU(T);var v=+$('n').value;$('nv').textContent=v.toFixed(1);
var C={o:css('--o'),t:css('--t'),v:css('--v'),ink:css('--ink'),mute:css('--mute'),card:css('--card'),line:css('--line')};
for(var i=0;i<DR.length;i++){cx[i].clearRect(0,0,sz[i][0],sz[i][1]);$('v'+i).innerHTML=DR[i](cx[i],sz[i][0],sz[i][1],v,T,C,dt)}
requestAnimationFrame(fr)}
requestAnimationFrame(fr);
</script></body></html>
