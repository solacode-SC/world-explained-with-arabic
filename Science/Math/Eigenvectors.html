<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Eigenvectors: Directions That Don’t Turn</title><style>:root{--bg:#f6f1e6;--card:#efe8d8;--ink:#1c2a44;--mute:#52607a;--o:#d9572b;--t:#1a9aa8;--v:#7c5cc4;--line:#c9bfa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#161d30;--ink:#eef1f8;--mute:#9aa6c2;--o:#ff8a52;--t:#3fd0de;--v:#b79cff;--line:#2c3656;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#161d30;--ink:#eef1f8;--mute:#9aa6c2;--o:#ff8a52;--t:#3fd0de;--v:#b79cff;--line:#2c3656;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:10px 12px}
h1{font-size:clamp(20px,3.6vw,34px);text-align:center;margin:0;letter-spacing:-.02em;line-height:1.15}
.sub{text-align:center;color:var(--mute);font-size:clamp(12px,1.7vw,16px);margin:2px 0 8px}.sub b{color:var(--o)}
.row{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.p{background:var(--card);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;min-height:0;min-width:0}
.hd{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}.hd h2{margin:0;font-size:clamp(14px,1.9vw,18px)}
.fm{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,2.2vw,22px)}
.ds{font-size:12px;color:var(--mute);width:100%}
.cv{position:relative;flex:1;min-height:0}.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.val{font-family:Georgia,serif;font-size:clamp(12px,1.5vw,15px);color:var(--mute);text-align:center}.val b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:12px;padding-top:8px;font-size:14px;color:var(--mute)}
.bar label{flex:1;display:flex;align-items:center;gap:10px}.bar label b{color:var(--ink);min-width:3ch}
input[type=range]{flex:1;accent-color:var(--o)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
@media(max-width:700px){.row{grid-template-columns:1fr;grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:6px}.ds{display:none}.p{padding:6px 10px}}
@media(max-height:520px){.sub{display:none}}</style></head><body>
<h1>Eigenvectors: Directions That Don’t Turn</h1><p class="sub">A matrix turns most vectors. <b>Eigenvectors</b> only get stretched, by their eigenvalue λ.</p><div class="row" id="row"></div>
<div class="bar"><label>Off-diagonal b <b id="nv"></b><input id="n" type="range" min="0" max="2" step="0.05" value="0.8"></label><button id="au">Auto: on</button></div>
<script>
var $=function(i){return document.getElementById(i)},PN=[["o", "A vector", "v ↦ Av", "Most vectors change direction. The gold lines do not."], ["t", "A grid", "Av = λv", "The whole grid stretches, but the gold lines stay in place."], ["v", "A circle", "circle → ellipse", "The ellipse axes lie along the eigenvectors."]];
$('row').style.setProperty('--n',PN.length);
$('row').innerHTML=PN.map(function(p,i){return '<section class="p"><div class="hd"><h2 style="color:var(--'+p[0]+')">'+p[1]+'</h2><span class="fm">'+p[2]+'</span><span class="ds">'+p[3]+'</span></div><div class="cv"><canvas id="c'+i+'"></canvas></div><div class="val" id="v'+i+'"></div></section>'}).join('');
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
var cvs=PN.map(function(p,i){return $('c'+i)}),cx=cvs.map(function(c){return c.getContext('2d')}),sz=PN.map(function(){return[300,300]});
var ro=new ResizeObserver(function(){cvs.forEach(function(c,i){var b=c.parentNode.getBoundingClientRect(),d=window.devicePixelRatio||1;sz[i]=[b.width,b.height];c.width=Math.max(1,b.width*d);c.height=Math.max(1,b.height*d);cx[i].setTransform(d,0,0,d,0,0)})});
cvs.forEach(function(c){ro.observe(c.parentNode)});
function txt(c,s,x,y,col,z,al){c.fillStyle=col;c.font='italic '+(z||14)+'px Georgia,serif';c.textAlign=al||'center';c.fillText(s,x,y)}
function arrow(c,x1,y1,x2,y2,col,lw){if(Math.hypot(x2-x1,y2-y1)<4)return;c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||2.5;c.setLineDash([]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();var a=Math.atan2(y2-y1,x2-x1),k=Math.min(10,3+lw*2);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-k*Math.cos(a-.4),y2-k*Math.sin(a-.4));c.lineTo(x2-k*Math.cos(a+.4),y2-k*Math.sin(a+.4));c.fill();c.restore()}
function E(b){var d=Math.sqrt(.25+b*b);return{l1:1.5+d,l2:1.5-d,th:.5*Math.atan2(2*b,1)}}
function Am(b,x,y){return[2*x+b*y,b*x+y]}
var GOLD='#e0a82e';
function lines(c,w,h,e){c.save();c.setLineDash([6,5]);c.strokeStyle=GOLD;c.lineWidth=2;[e.th,e.th+Math.PI/2].forEach(function(a){var L=Math.max(w,h);c.beginPath();c.moveTo(w/2-L*Math.cos(a),h/2+L*Math.sin(a));c.lineTo(w/2+L*Math.cos(a),h/2-L*Math.sin(a));c.stroke()});c.restore()}
var DR=[function(c,w,h,b,T,C){var e=E(b),u=Math.min(w,h)*.5/(e.l1*1.1),x0=w/2,y0=h/2;lines(c,w,h,e);
c.strokeStyle=C.line;c.lineWidth=1;c.beginPath();c.arc(x0,y0,u,0,7);c.stroke();
var al=T*.6,v=[Math.cos(al),Math.sin(al)],a=Am(b,v[0],v[1]);
arrow(c,x0,y0,x0+v[0]*u,y0-v[1]*u,C.t,3);arrow(c,x0,y0,x0+a[0]*u,y0-a[1]*u,C.o,3);
txt(c,'v',x0+v[0]*u*1.12,y0-v[1]*u*1.12,C.t,15);txt(c,'Av',x0+a[0]*u*1.08,y0-a[1]*u*1.08-4,C.o,15);
var d=Math.atan2(a[1],a[0])-al;d=Math.atan2(Math.sin(d),Math.cos(d));
return 'v turns by <b>'+(d*180/Math.PI).toFixed(0)+'°</b> · on the gold lines it turns by 0°'},
function(c,w,h,b,T,C){var e=E(b),um=.5-.5*Math.cos(T*.7),s=Math.min(w,h)*.5/2.2,x0=w/2,y0=h/2;
var M=function(x,y){var a=Am(b,x,y);return[x+(a[0]-x)*um,y+(a[1]-y)*um]};
c.save();c.beginPath();c.rect(0,0,w,h);c.clip();c.strokeStyle=C.t;c.lineWidth=1.2;c.globalAlpha=.7;
for(var k=-3;k<=3;k++){[[k,-3,k,3],[-3,k,3,k]].forEach(function(q){var p=M(q[0],q[1]),r=M(q[2],q[3]);c.beginPath();c.moveTo(x0+p[0]*s,y0-p[1]*s);c.lineTo(x0+r[0]*s,y0-r[1]*s);c.stroke()})}
c.globalAlpha=1;c.restore();lines(c,w,h,e);
var m1=1+(e.l1-1)*um,m2=1+(e.l2-1)*um;
arrow(c,x0,y0,x0+Math.cos(e.th)*m1*s,y0-Math.sin(e.th)*m1*s,GOLD,3.5);arrow(c,x0,y0,x0-Math.sin(e.th)*m2*s,y0-Math.cos(e.th)*m2*s,GOLD,3.5);
return 'stretch ×λ₁ = <b>'+e.l1.toFixed(2)+'</b> · ×λ₂ = <b>'+e.l2.toFixed(2)+'</b>'},
function(c,w,h,b,T,C){var e=E(b),s=Math.min(w,h)*.5/(e.l1*1.15),x0=w/2,y0=h/2;
c.save();c.setLineDash([5,5]);c.strokeStyle=C.mute;c.lineWidth=1.5;c.beginPath();c.arc(x0,y0,s,0,7);c.stroke();c.restore();
c.strokeStyle=C.o;c.lineWidth=3;c.beginPath();for(var i=0;i<=100;i++){var a=i/100*6.2832,p=Am(b,Math.cos(a),Math.sin(a));i?c.lineTo(x0+p[0]*s,y0-p[1]*s):c.moveTo(x0+p[0]*s,y0-p[1]*s)}c.stroke();
c.strokeStyle=GOLD;c.lineWidth=2;[[e.th,e.l1],[e.th+Math.PI/2,e.l2]].forEach(function(q){c.beginPath();c.moveTo(x0-Math.cos(q[0])*q[1]*s,y0+Math.sin(q[0])*q[1]*s);c.lineTo(x0+Math.cos(q[0])*q[1]*s,y0-Math.sin(q[0])*q[1]*s);c.stroke()});
var a=T*.6,p=[Math.cos(a),Math.sin(a)],q=Am(b,p[0],p[1]);c.strokeStyle=C.mute;c.lineWidth=1;c.beginPath();c.moveTo(x0+p[0]*s,y0-p[1]*s);c.lineTo(x0+q[0]*s,y0-q[1]*s);c.stroke();
c.fillStyle=C.t;c.beginPath();c.arc(x0+p[0]*s,y0-p[1]*s,5,0,7);c.fill();c.fillStyle=C.o;c.beginPath();c.arc(x0+q[0]*s,y0-q[1]*s,5,0,7);c.fill();
return 'det A = λ₁λ₂ = <b>'+(e.l1*e.l2).toFixed(2)+'</b> · trace = λ₁+λ₂ = <b>3.00</b>'}];
function AU(T){return 1+.95*Math.sin(T*.3)}
var T=0,last=0,auto=true;
$('au').onclick=function(){auto=!auto;this.textContent='Auto: '+(auto?'on':'off')};
$('n').addEventListener('input',function(){auto=false;$('au').textContent='Auto: off'});
function fr(ts){var dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;T+=dt;if(auto)$('n').value=AU(T);var v=+$('n').value;$('nv').textContent=v.toFixed(2);
var C={o:css('--o'),t:css('--t'),v:css('--v'),ink:css('--ink'),mute:css('--mute'),card:css('--card'),line:css('--line')};
for(var i=0;i<DR.length;i++){cx[i].clearRect(0,0,sz[i][0],sz[i][1]);$('v'+i).innerHTML=DR[i](cx[i],sz[i][0],sz[i][1],v,T,C,dt)}
requestAnimationFrame(fr)}
requestAnimationFrame(fr);
</script></body></html>
